# collab-cli 真 CI —— typecheck + lint + test（经 npm run check）
name: CI

on:
  pull_request:
  push:
    branches: [main, master, collab-new]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
